<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="spark-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow-spark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Cyber Shield Frame -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#070A12" stroke="url(#spark-grad)" stroke-width="2"/>

  <!-- ==================== KM SENTIENT SPARK MONOGRAM ==================== -->
  <!-- K Vertical Spine -->
  <line x1="16" y1="16" x2="16" y2="48" stroke="url(#spark-grad)" stroke-width="4.8" stroke-linecap="round"/>
  
  <!-- K Upper Arm connecting to M Peak -->
  <line x1="16" y1="32" x2="27" y2="18" stroke="url(#spark-grad)" stroke-width="4.2" stroke-linecap="round"/>
  
  <!-- K Lower Leg -->
  <line x1="16" y1="32" x2="27" y2="48" stroke="url(#spark-grad)" stroke-width="4.2" stroke-linecap="round"/>

  <!-- M Central V-Slants -->
  <path d="M27 18 L38 32 L48 18" stroke="url(#spark-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- M Right Vertical Pillar -->
  <line x1="48" y1="18" x2="48" y2="48" stroke="url(#spark-grad)" stroke-width="4.8" stroke-linecap="round"/>

  <!-- 4-Point AI Sentience Singularity Spark -->
  <path d="M48 10 Q48 14 44 14 Q48 14 48 18 Q48 14 52 14 Q48 14 48 10 Z" fill="#5EEAD4" filter="url(#glow-spark)"/>
  
  <!-- Center Synaptic AI Focal Node -->
  <circle cx="27" cy="18" r="2.8" fill="#5EEAD4"/>
</svg>
