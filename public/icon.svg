<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="kmai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="kmai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#070A12" stroke="url(#kmai-grad)" stroke-width="1.8" />
  
  <!-- Subtle Internal Circuit Lines -->
  <path d="M10 32 H14 M50 32 H54 M32 10 V14 M32 50 V54" stroke="url(#kmai-grad)" stroke-width="1" opacity="0.4" stroke-linecap="round" />

  <!-- === The K + M + AI Integrated Geometry === -->

  <!-- 1. LEFT STEM (Forms left of K, left of M, and vertical reference) -->
  <path d="M16 16 V48" stroke="url(#kmai-grad)" stroke-width="3.6" stroke-linecap="round" />
  <circle cx="16" cy="16" r="2.2" fill="#5EEAD4" />
  <circle cx="16" cy="48" r="2.2" fill="#818CF8" />

  <!-- 2. THE 'M' VALLEY & 'K' UPPER ARM (with crossbar forming 'A') -->
  <!-- Left-to-Center slant -->
  <path d="M16 16 L27 32" stroke="url(#kmai-grad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center-to-Right peak slant (completes M valley & K upper branch) -->
  <path d="M27 32 L38 16" stroke="url(#kmai-grad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="38" cy="16" r="2.2" fill="#5EEAD4" />

  <!-- Horizontal crossbar across the upper wedge to form the 'A' of AI -->
  <path d="M21 24.5 H33" stroke="#5EEAD4" stroke-width="2.2" stroke-linecap="round" />

  <!-- 3. 'K' LOWER LEG -->
  <path d="M27 32 L38 48" stroke="url(#kmai-grad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="38" cy="48" r="2.2" fill="#818CF8" />

  <!-- 4. RIGHT STEM (Completes 'M' right wing, and forms the 'I' in AI) -->
  <!-- Right peak down to base -->
  <path d="M38 16 L48 30 V48" stroke="url(#kmai-grad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 'I' dot floating above the right pillar representing AI intelligence -->
  <circle cx="48" cy="16" r="2.5" fill="#818CF8" filter="url(#kmai-glow)" />
  <circle cx="48" cy="48" r="2.2" fill="#818CF8" />

  <!-- 5. CENTRAL AI NEURAL CORE (where K, M, and A converge) -->
  <circle cx="27" cy="32" r="3.8" fill="#070A12" stroke="#5EEAD4" stroke-width="2" />
  <circle cx="27" cy="32" r="1.8" fill="#5EEAD4" filter="url(#kmai-glow)" />
</svg>
